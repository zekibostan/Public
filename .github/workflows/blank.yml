name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          if [ -f tv.zip ]; then
            unzip -o tv.zip -d tv_project
          else
            echo "tv.zip bulunamadi, devam ediliyor..."
          fi

      - name: 3. ChannelsFragment.kt: lifecycleScope importunu ekle (gerekiyorsa)
        run: |
          FILE=tv_project/app/src/main/java/com/egze/tvplus/ChannelsFragment.kt
          if [ -f "$FILE" ]; then
            echo "ChannelsFragment.kt bulundu. import kontrol ediliyor..."
            if ! grep -q "import androidx.lifecycle.lifecycleScope" "$FILE"; then
              # kotlinx.coroutines.launch satirindan hemen sonra lifecycleScope importunu ekle
              sed -i '/import kotlinx.coroutines.launch/a import androidx.lifecycle.lifecycleScope' "$FILE"
              echo "lifecycleScope importu eklendi."
            else
              echo "lifecycleScope importu zaten mevcut."
            fi
          else
            echo "ChannelsFragment.kt bulunamadi, atlanıyor."
          fi

      - name: 4. ChannelsSearchFragment.kt: hatali importlari temizle
        run: |
          FILE=tv_project/app/src/main/java/com/egze/tvplus/ChannelsSearchFragment.kt
          if [ -f "$FILE" ]; then
            echo "ChannelsSearchFragment.kt bulundu. Hatalı importlar temizleniyor..."
            # searchResultProvider veya setSearchAffordanceColor gibi hatalı/kullanilmayan importlari sil
            sed -i '/searchResultProvider/d' "$FILE"
            sed -i '/setSearchAffordanceColor/d' "$FILE"
            sed -i '/OnItemViewClickedListener/d' "$FILE"
            # fazlaysa çift boşlukları azalt
            sed -i 's/[[:space:]]\{2,\}/ /g' "$FILE"
            echo "Temizleme tamam."
          else
            echo "ChannelsSearchFragment.kt bulunamadi, atlanıyor."
          fi

      - name: 5. app/build.gradle'a gerekli dependency'leri ekle (varsa üzerine yazmaz)
        run: |
          FILE=tv_project/app/build.gradle
          if [ -f "$FILE" ]; then
            echo "app/build.gradle mevcut. Yedek aliyorum ve gerekli kontrolleri yapiyorum..."
            cp "$FILE" "$FILE.bak"
            # Örnek kontrol: kotlin-stdlib varsa atla, yoksa bilgi ver
            if ! grep -q "kotlin-stdlib" "$FILE"; then
              echo "kotlin-stdlib bulunmuyor. Lütfen manual olarak kontrol et veya build.gradle'ı güncelle."
            else
              echo "app/build.gradle gerekli kotlin dependency'sine sahip."
            fi
          else
            echo "app/build.gradle bulunamadi. Varsayilan basit build.gradle oluşturuluyor..."
            mkdir -p tv_project/app
            printf "%s\n" "plugins {" \
              "    id 'com.android.application'" \
              "    id 'org.jetbrains.kotlin.android'" \
              "    id 'kotlin-kapt'" \
              "    id 'kotlin-parcelize'" \
              "}" \
              "" \
              "android {" \
              "    namespace 'com.egze.tvplus'" \
              "    compileSdk 35" \
              "" \
              "    defaultConfig {" \
              "        applicationId \"com.egze.tvplus\"" \
              "        minSdk 21" \
              "        targetSdk 35" \
              "        versionCode 1" \
              "        versionName \"1.0\"" \
              "    }" \
              "" \
              "    buildTypes {" \
              "        release {" \
              "            minifyEnabled false" \
              "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'" \
              "        }" \
              "    }" \
              "" \
              "    compileOptions {" \
              "        sourceCompatibility JavaVersion.VERSION_17" \
              "        targetCompatibility JavaVersion.VERSION_17" \
              "    }" \
              "    kotlinOptions {" \
              "        jvmTarget = \"17\"" \
              "    }" \
              "}" \
              "" \
              "dependencies {" \
              "    implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.9.0\"" \
              "    implementation 'androidx.core:core-ktx:1.9.0'" \
              "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
              "    implementation 'androidx.leanback:leanback:1.2.0'" \
              "    implementation \"androidx.lifecycle:lifecycle-runtime-ktx:2.7.0\"" \
              "    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'" \
              "    implementation 'com.squareup.retrofit2:retrofit:2.9.0'" \
              "    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'" \
              "    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'" \
              "    implementation 'com.github.bumptech.glide:glide:4.15.1'" \
              "    kapt 'com.github.bumptech.glide:compiler:4.15.1'" \
              "    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'" \
              "}" > "$FILE"
            echo "Basit build.gradle oluşturuldu."
          fi

      - name: 6. Kok build.gradle (root) olustur (varsa uzerine yazar)
        run: |
          cat > tv_project/build.gradle <<'GRD'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.6.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
GRD

      - name: 7. gradle.properties Ayarlari
        run: |
          mkdir -p tv_project
          printf "%s\n" "android.useAndroidX=true" "android.enableJetifier=true" "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" > tv_project/gradle.properties

      - name: 8. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 9. Gerekli Android SDK (35) Kurulumu
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: "35.0.0"

      - name: 10. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          # (Diğer lisanslar isteğe bağlı — CI ortamına göre değişir)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 11. Gradle Kurulumu (8.10.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 12. Debug APK'sini Olustur
        run: |
          if [ -d tv_project ]; then
            cd tv_project || exit 1
            ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          else
            echo "tv_project klasoru yok — build atlanacak."
            exit 0
          fi

      - name: 13. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
