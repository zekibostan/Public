name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project

      #########################################################################
      # 3. ChannelsFragment.kt – HATASIZ, DERLENEBİLİR
      #########################################################################
      - name: 3. ChannelsFragment.kt'yi Yeniden Yaz
        run: |
          echo "ChannelsFragment.kt yeniden oluşturuluyor..."
          cat <<'EOF' > tv_project/app/src/main/java/com/egze/tvplus/ChannelsFragment.kt
package com.egze.tvplus

import android.content.Intent
import android.os.Bundle
import android.util.Log
import androidx.core.content.ContextCompat
import androidx.leanback.app.BrowseSupportFragment
import androidx.leanback.widget.ArrayObjectAdapter
import androidx.leanback.widget.HeaderItem
import androidx.leanback.widget.ListRow
import androidx.leanback.widget.ListRowPresenter
import androidx.lifecycle.lifecycleScope
import com.egze.tvplus.api.RetrofitClient
import com.egze.tvplus.data.ChannelsRepository
import com.egze.tvplus.presenter.ChannelPresenter
import kotlinx.coroutines.CoroutineExceptionHandler
import kotlinx.coroutines.launch

class ChannelsFragment : BrowseSupportFragment() {

    private val rowsAdapter = ArrayObjectAdapter(ListRowPresenter())

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        title = "EgzeTv+"
        headersState = HEADERS_DISABLED
        adapter = rowsAdapter

        setOnSearchClickedListener {
            val intent = Intent(requireContext(), SearchActivity::class.java)
            ContextCompat.startActivity(requireContext(), intent, null)
        }

        fetchChannels()
    }

    private fun fetchChannels() {
        val handler = CoroutineExceptionHandler { _, ex ->
            Log.e("ChannelsFragment", "API error: ${ex.message}")
        }

        lifecycleScope.launch(handler) {
            val resp = RetrofitClient.api.getChannels()
            val channels = resp.channels.filter { it.platform_android == "1" }
            ChannelsRepository.channels = channels

            val grouped = channels.groupBy { it.description ?: "Diğer" }
            val cardPresenter = ChannelPresenter(requireContext())
            rowsAdapter.clear()

            for ((category, list) in grouped) {
                val header = HeaderItem(category)
                val rowAdapter = ArrayObjectAdapter(cardPresenter)
                list.forEach { rowAdapter.add(it) }
                rowsAdapter.add(ListRow(header, rowAdapter))
            }
        }
    }

    override fun onResume() {
        super.onResume()
        setOnItemViewClickedListener { _, item, _, _ ->
            if (item is com.egze.tvplus.model.Channel) {
                val intent = Intent(requireContext(), PlayerActivity::class.java)
                val index =
                    ChannelsRepository.channels.indexOfFirst { it.id == item.id }
                intent.putExtra("channel_index", index)
                startActivity(intent)
            }
        }
    }
}
EOF

      #########################################################################
      # 4. ChannelsSearchFragment.kt – TAM DÜZELTİLMİŞ (HATALI IMPORTLAR SİLİNDİ)
      #########################################################################
      - name: 4. ChannelsSearchFragment.kt'yi Yeniden Yaz
        run: |
          echo "ChannelsSearchFragment.kt yeniden oluşturuluyor..."
          cat <<'EOF' > tv_project/app/src/main/java/com/egze/tvplus/ChannelsSearchFragment.kt
package com.egze.tvplus

import android.content.Intent
import android.os.Bundle
import android.util.Log
import androidx.leanback.app.SearchSupportFragment
import androidx.leanback.widget.ArrayObjectAdapter
import androidx.leanback.widget.HeaderItem
import androidx.leanback.widget.ListRow
import androidx.leanback.widget.ListRowPresenter
import androidx.leanback.widget.Presenter
import com.egze.tvplus.data.ChannelsRepository
import com.egze.tvplus.model.Channel
import com.egze.tvplus.presenter.ChannelPresenter

class ChannelsSearchFragment : SearchSupportFragment(), SearchSupportFragment.SearchResultProvider {

    private val rowsAdapter = ArrayObjectAdapter(ListRowPresenter())

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        searchResultProvider = this

        setOnItemViewClickedListener { _, item, _, _ ->
            if (item is Channel) {
                val intent = Intent(requireContext(), PlayerActivity::class.java)
                val index = ChannelsRepository.channels.indexOfFirst { it.id == item.id }
                intent.putExtra("channel_index", index)
                startActivity(intent)
            }
        }
    }

    override fun getResultsAdapter(): ArrayObjectAdapter = rowsAdapter

    override fun onQueryTextChange(newQuery: String?): Boolean {
        updateResults(newQuery ?: "")
        return true
    }

    override fun onQueryTextSubmit(query: String?): Boolean {
        updateResults(query ?: "")
        return true
    }

    private fun updateResults(q: String) {
        rowsAdapter.clear()
        if (q.isEmpty()) return

        try {
            val filtered = ChannelsRepository.channels
                .filter { it.title.contains(q, ignoreCase = true) }

            val presenter: Presenter = ChannelPresenter(requireContext())
            val rowAdapter = ArrayObjectAdapter(presenter)
            filtered.forEach { rowAdapter.add(it) }

            if (filtered.isNotEmpty()) {
                rowsAdapter.add(ListRow(HeaderItem("Arama Sonuçları"), rowAdapter))
            }
        } catch (ex: Exception) {
            Log.e("ChannelsSearch", "Search error: ${ex.message}")
        }
    }
}
EOF

      #########################################################################
      # 5. app/build.gradle – SORUNSUZ
      #########################################################################
      - name: 5. app/build.gradle Dosyasini Yeniden Yaz
        run: |
          rm tv_project/app/build.gradle
          cat <<'EOF' > tv_project/app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.egze.tvplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.egze.tvplus"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.2.0'

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.activity:activity-ktx:1.8.2"

    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'

    implementation 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
EOF

      #########################################################################
      # 5.5 – AndroidManifest.xml
      #########################################################################
      - name: 5.5 AndroidManifest.xml Yaz
        run: |
          rm tv_project/app/src/main/AndroidManifest.xml
          cat <<'EOF' > tv_project/app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-feature android:name="android.software.leanback" android:required="true" />
    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

    <application
        android:label="@string/app_name"
        android:icon="@mipmap/ic_launcher"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="landscape">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
            </intent-filter>
        </activity>

        <activity android:name=".PlayerActivity" />
        <activity android:name=".SearchActivity" />

    </application>
</manifest>
EOF

      #########################################################################
      # 5.6 – Player XML Fix
      #########################################################################
      - name: 5.6 activity_player.xml Duzeltme
        run: |
          sed -i 's/android:use_controller/app:use_controller/g' tv_project/app/src/main/res/layout/activity_player.xml
          sed -i 's/xmlns:android="/xmlns:android=" http:\/\/schemas.android.com\/apk\/res\/android" xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/' tv_project/app/src/main/res/layout/activity_player.xml

      #########################################################################
      # 6. Root build.gradle
      #########################################################################
      - name: 6. build.gradle (root)
        run: |
          cat <<'EOF' > tv_project/build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.6.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
EOF

      #########################################################################
      # 7. gradle.properties
      #########################################################################
      - name: 7. gradle.properties
        run: |
          echo "android.useAndroidX=true" > tv_project/gradle.properties
          echo "android.enableJetifier=true" >> tv_project/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> tv_project/gradle.properties

      #########################################################################
      # 8. Java 17
      #########################################################################
      - name: 8. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      #########################################################################
      # 9. Android SDK 35
      #########################################################################
      - name: 9. Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      #########################################################################
      # 10. Lisanslar
      #########################################################################
      - name: 10. Android Lisanslari
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      #########################################################################
      # 11. Gradle 8.10.2
      #########################################################################
      - name: 11. Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      #########################################################################
      # 12. APK Build
      #########################################################################
      - name: 12. Debug APK Olustur
        run: |
          cd tv_project
          gradle assembleDebug --stacktrace

      #########################################################################
      # 13. APK Artifact
      #########################################################################
      - name: 13. APK Artifact Yukle
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
