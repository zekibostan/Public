name: Build APK from tv.zip

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Extract tv.zip
        run: |
          unzip -o tv.zip -d project
          echo "Zip extracted to project/"

      - name: Install Gradle 8.4 to generate wrapper (SAFE FOR ANDROID)
        run: |
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip gradle.zip -d /opt/gradle
          export PATH="/opt/gradle/gradle-8.4/bin:$PATH"
          gradle -v

      - name: Create Gradle wrapper (Android-compatible)
        run: |
          cd project
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
            echo "Android-compatible Gradle wrapper created (8.4)"
          else
            echo "gradlew already exists"
          fi

      - name: Make wrapper executable
        run: |
          cd project
          chmod +x gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APK
        run: |
          cd project
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EgzeTvPlus-APK
          path: project/app/build/outputs/apk/debug/*.apk
