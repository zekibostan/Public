    - name: 🏗️ Hata Ayıklama (Debug) APK'sını Oluştur
      # Derleme ve paketleme işlemini başlatır.
      run: ./gradlew assembleDebug

    - name: 📤 APK Dosyasını Yükle (Artifact)
      # Oluşturulan APK dosyasını GitHub Actions'ın sonuç sayfasına yükler
      uses: actions/upload-artifact@v4
      with:
        name: android-tv-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
