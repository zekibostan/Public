name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek (Checkout Repository)
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "tv.zip dosyasini tv_project klasorune cikariyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      - name: 3. gradlew'ye Calistirma Izni Ver (chmod +x)
        run: chmod +x tv_project/gradlew
          
      - name: 4. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 🚀 KRİTİK ADIM: Android SDK Lisanslarini Kabul Etme
      - name: 5. Android SDK Lisanslarini Kabul Et
        run: |
          # Bu komut, gerekli tum Android SDK lisanslarini otomatik kabul eder.
          yes | sdkmanager --licenses || true 
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          
      - name: 6. Gradle Onbellegini Yapilandir
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_project/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      # 🛠️ GÜNCELLEME: Debug APK'sini Olustur (cd komutu kaldirildi, direk yol kullaniliyor)
      - name: 7. Debug (Hata Ayiklama) APK'sini Olustur
        run: |
          echo "Gradle çalıştırılıyor..."
          # cd komutu olmadan, gradlew dosyasina dogrudan erisim saglaniyor
          ./tv_project/gradlew assembleDebug --stacktrace
          
      - name: 8. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
