        # ChannelModel.kt ve ApiResponse.kt
        cat > app/src/main/kotlin/com/example/tvapp/model/ChannelModel.kt << 'EOF_MODEL'
package com.example.tvapp.model

import android.os.Parcelable
import kotlinx.parcelize.Parcelize
import com.google.gson.annotations.SerializedName

@Parcelize
data class ChannelModel(
    val id: String,
    val title: String, 
    val thumbImg: String,
    val url: String, 
    val description: String, 
    @SerializedName("platform_android") val platformAndroid: String 
) : Parcelable

data class ApiResponse(
    val status: String,
    @SerializedName("updated_at") val updatedAt: String,
    val channels: List<ChannelModel>
)
// EOF_MODEL
EOF_MODEL
        
