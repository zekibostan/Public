name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      - name: 3. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🚀 ADIM 4: Windows formatindaki gradlew dosyasini Linux uyumlu hale getiriyoruz
      - name: 4. gradlew Dosyasini Tamir Et (dos2unix)
        run: |
          # dos2unix aracini yukle
          sudo apt-get update
          sudo apt-get install -y dos2unix
          
          # Dosya formatini Windows'tan (CRLF) Unix'e (LF) cevir
          dos2unix tv_project/gradlew
          
          # Calistirma izni ver
          chmod +x tv_project/gradlew
          
          echo "gradlew dosyasi onarildi ve hazir."

      # ADIM 5: Lisanslari Manuel Olustur (Bu yontem sorunsuz calisiyordu, koruyoruz)
      - name: 5. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 6. Gradle Onbellegini Yapilandir
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_project/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      # 🚀 ADIM 7: Artik onarilmis kendi gradlew dosyasini kullaniyoruz
      - name: 7. Debug APK'sini Olustur
        run: |
          echo "Projenin kendi Gradle surumuyle build baslatiliyor..."
          cd tv_project
          # Artik ./gradlew komutu hatasiz calismali
          ./gradlew assembleDebug --stacktrace
          
      - name: 8. Klasor Kontrolu (Hata Ayiklama)
        if: always()
        run: |
          echo "Build sonrasi klasor yapisi:"
          ls -R tv_project/app/build/outputs/apk/ || echo "APK klasoru bulunamadi"

      - name: 9. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
