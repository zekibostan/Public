name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      # 🚀 KRITIK KOD DOSYALARINI YENIDEN YAZMA ADIMLARI
      
      - name: 3. ChannelsFragment.kt'yi Duzelt (lifecycleScope import eklendi)
        run: |
          echo "ChannelsFragment.kt dosyasi lifecycleScope importu ile yeniden yaziliyor..."
          cat <<'EOF' > tv_project/app/src/main/java/com/egze/tvplus/ChannelsFragment.kt
package com.egze.tvplus

import android.content.Intent
import android.os.Bundle
import android.util.Log
import androidx.core.content.ContextCompat
import androidx.leanback.app.BrowseSupportFragment
import androidx.leanback.widget.ArrayObjectAdapter
import androidx.leanback.widget.HeaderItem
import androidx.leanback.widget.ListRow
import androidx.leanback.widget.ListRowPresenter
import com.egze.tvplus.api.RetrofitClient
import com.egze.tvplus.data.ChannelsRepository
import com.egze.tvplus.presenter.ChannelPresenter
import kotlinx.coroutines.CoroutineExceptionHandler
import kotlinx.coroutines.launch
import androidx.lifecycle.lifecycleScope 

class ChannelsFragment : BrowseSupportFragment() {

    private val rowsAdapter = ArrayObjectAdapter(ListRowPresenter())

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        title = "EgzeTv+"
        headersState = HEADERS_DISABLED
        adapter = rowsAdapter

        setOnSearchClickedListener {
            // Open SearchActivity (Leanback Search)
            val intent = Intent(requireContext(), SearchActivity::class.java)
            ContextCompat.startActivity(requireContext(), intent, null)
        }

        fetchChannels()
    }

    private fun fetchChannels() {
        val handler = CoroutineExceptionHandler { _, ex ->
            Log.e("ChannelsFragment", "API error: ${ex.message}")
        }
        // lifecycleScope kullanimi ile suspend fonksiyonu cagrildi
        lifecycleScope.launch(handler) {
            val resp = RetrofitClient.api.getChannels()
            val channels = resp.channels.filter { it.platform_android == "1" }
            ChannelsRepository.channels = channels
            val grouped = channels.groupBy { it.description ?: "Diğer" }
            val cardPresenter = ChannelPresenter(requireContext())
            rowsAdapter.clear()
            for ((category, list) in grouped) {
                val header = HeaderItem(category)
                val listRowAdapter = ArrayObjectAdapter(cardPresenter)
                list.forEach { listRowAdapter.add(it) }
                rowsAdapter.add(ListRow(header, listRowAdapter))
            }
        }
    }

    override fun onResume() {
        super.onResume()
        setOnItemViewClickedListener { itemViewHolder, item, rowViewHolder, row ->
            if (item is com.egze.tvplus.model.Channel) {
                val intent = android.content.Intent(requireContext(), PlayerActivity::class.java)
                val index = ChannelsRepository.channels.indexOfFirst { it.id == item.id }
                intent.putExtra("channel_index", index)
                startActivity(intent)
            }
        }
    }
}
EOF
      
      - name: 4. ChannelsSearchFragment.kt'yi Duzelt (KTX importlari ve onItemClicked kaldirildi)
        run: |
          echo "ChannelsSearchFragment.kt dosyasi KTX importlari ve onItemClicked duzeltilerek yeniden yaziliyor..."
          cat <<'EOF' > tv_project/app/src/main/java/com/egze/tvplus/ChannelsSearchFragment.kt
package com.egze.tvplus

import androidx.leanback.app.SearchSupportFragment
import androidx.leanback.widget.ArrayObjectAdapter
import androidx.leanback.widget.HeaderItem
import androidx.leanback.widget.ListRow
import androidx.leanback.widget.ListRowPresenter
import androidx.leanback.widget.Presenter
import android.content.Intent
import android.os.Bundle
import android.util.Log
import com.egze.tvplus.data.ChannelsRepository
import com.egze.tvplus.presenter.ChannelPresenter
import com.egze.tvplus.model.Channel
import androidx.leanback.app.searchResultProvider 
import androidx.leanback.app.setSearchAffordanceColor 
import androidx.leanback.widget.OnItemViewClickedListener 

class ChannelsSearchFragment : SearchSupportFragment(), SearchSupportFragment.SearchResultProvider {

    private val rowsAdapter = ArrayObjectAdapter(ListRowPresenter())

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        searchResultProvider = this
        // optional hint
        setSearchAffordanceColor(0xFF0D47A1.toInt())
        
        // ChannelsFragment'in mantigina uyumlu olarak item tiklama listener'i eklendi
        setOnItemViewClickedListener { itemViewHolder, item, rowViewHolder, row ->
            if (item is Channel) {
                val intent = Intent(requireContext(), PlayerActivity::class.java)
                val index = ChannelsRepository.channels.indexOfFirst { it.id == item.id }
                intent.putExtra("channel_index", index)
                startActivity(intent)
            }
        }
    }
    
    override fun getResultsAdapter(): ArrayObjectAdapter {
        return rowsAdapter
    }

    override fun onQueryTextChange(newQuery: String?): Boolean {
        val q = newQuery?.trim() ?: ""
        updateResults(q)
        return true
    }

    override fun onQueryTextSubmit(query: String?): Boolean {
        updateResults(query ?: "")
        return true
    }

    private fun updateResults(q: String) {
        rowsAdapter.clear()
        if (q.isEmpty()) return
        try {
            val all = ChannelsRepository.channels
            val filtered = all.filter { it.title.contains(q, ignoreCase=true) }
            val presenter: Presenter = ChannelPresenter(requireContext())
            val rowAdapter = ArrayObjectAdapter(presenter)
            filtered.forEach { rowAdapter.add(it) }
            if (filtered.isNotEmpty()) {
                rowsAdapter.add(ListRow(HeaderItem("Arama Sonuçları"), rowAdapter))
            }
        } catch (ex: Exception) {
            // String interpolation'u ($) dogru yazmak icin
            Log.e("ChannelsSearch", "Search error: ${ex.message}") 
        }
    }
}
EOF

      - name: 5. app/build.gradle Dosyasini Yeniden Olustur
        run: |
          echo "Eski app/build.gradle siliniyor ve yenisi yaziliyor..."
          rm tv_project/app/build.gradle
          cat <<'EOF' > tv_project/app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.egze.tvplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.egze.tvplus"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.2.0'
    
    // Coroutine ve lifecycleScope uzantilari
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"    
    implementation "androidx.activity:activity-ktx:1.8.2"    
    
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
EOF

      - name: 5.5 ADIM: AndroidManifest.xml Duzeltme
        run: |
          echo "AndroidManifest.xml dosyasi duzeltiliyor..."
          rm tv_project/app/src/main/AndroidManifest.xml
          cat <<'EOF' > tv_project/app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-feature android:name="android.software.leanback" android:required="true" />
    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">
        
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:icon="@mipmap/ic_launcher"
            android:label="@string/app_name"
            android:logo="@mipmap/ic_launcher"
            android:screenOrientation="landscape">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
            </intent-filter>
        </activity>
        
        <activity android:name=".PlayerActivity" />
        <activity android:name=".SearchActivity" />
    </application>
</manifest>
EOF

      - name: 5.6 ADIM: activity_player.xml Duzeltme
        run: |
          echo "activity_player.xml dosyasindaki hatali namespace duzeltiliyor..."
          sed -i 's/android:use_controller/app:use_controller/g' tv_project/app/src/main/res/layout/activity_player.xml
          sed -i 's/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android" xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/g' tv_project/app/src/main/res/layout/activity_player.xml

      - name: 6. Kok build.gradle Dosyasini Yeniden Olustur
        run: |
          cat <<'EOF' > tv_project/build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.6.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
EOF

      - name: 7. gradle.properties Ayarlari
        run: |
          touch tv_project/gradle.properties
          echo "android.useAndroidX=true" >> tv_project/gradle.properties
          echo "android.enableJetifier=true" >> tv_project/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> tv_project/gradle.properties

      - name: 8. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 9. Gerekli Android SDK (35) Kurulumu
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: 10. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          
      - name: 11. Gradle Kurulumu (8.10.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2' 
          
      - name: 12. Debug APK'sini Olustur
        run: |
          echo "Build baslatiliyor..."
          cd tv_project
          gradle assembleDebug --stacktrace --warning-mode all --refresh-dependencies
          
      - name: 13. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
