name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      # 🚀 GÜNCELLEME: SDK 35 ve AGP 8.6.0 Uyumlu build.gradle
      - name: 3. app/build.gradle Dosyasini Yeniden Olustur
        run: |
          echo "Eski app/build.gradle siliniyor ve yenisi yaziliyor..."
          rm tv_project/app/build.gradle
          
          cat <<EOF > tv_project/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-kapt'
          }

          android {
              namespace 'com.egze.tvplus'
              compileSdk 35  // HATA DUZELTME: SDK 35 yapildi

              defaultConfig {
                  applicationId "com.egze.tvplus"
                  minSdk 21
                  targetSdk 35  // HATA DUZELTME: SDK 35 yapildi
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              
              // Bu kutuphane SDK 35 istiyordu, artik sorun cikarmayacak
              implementation 'androidx.leanback:leanback:1.2.0'
              
              implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
              
              implementation 'com.squareup.retrofit2:retrofit:2.9.0'
              implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
              implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
              
              implementation 'com.github.bumptech.glide:glide:4.15.1'
              kapt 'com.github.bumptech.glide:compiler:4.15.1'
              
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF
          
          echo "✅ app/build.gradle SDK 35 ile yenilendi."

      # 🚀 GÜNCELLEME: AGP 8.6.0 sürümü ayarlandi
      - name: 4. Kok build.gradle Dosyasini Yeniden Olustur
        run: |
          cat <<EOF > tv_project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  // HATA DUZELTME: 8.1.1 -> 8.6.0 yapildi (Leanback istegi uzerine)
                  classpath "com.android.tools.build:gradle:8.6.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

      - name: 5. gradle.properties Ayarlari
        run: |
          touch tv_project/gradle.properties
          echo "android.useAndroidX=true" >> tv_project/gradle.properties
          echo "android.enableJetifier=true" >> tv_project/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> tv_project/gradle.properties

      - name: 6. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🚀 GÜNCELLEME: API Level 35 kuruluyor
      - name: 7. Gerekli Android SDK (35) Kurulumu
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: 8. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          
      # 🚀 GÜNCELLEME: Gradle 8.10.2 (AGP 8.6.0 ile uyumlu olmasi icin)
      - name: 9. Gradle Kurulumu (8.10.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2' 
          
      - name: 10. Debug APK'sini Olustur
        run: |
          echo "Build baslatiliyor..."
          cd tv_project
          # --refresh-dependencies: Tum kutuphaneleri sifirdan indirir
          gradle assembleDebug --stacktrace --warning-mode all --refresh-dependencies
          
      - name: 11. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
