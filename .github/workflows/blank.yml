name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek (Checkout Repository)
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "tv.zip dosyasini tv_project klasorune cikariyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      - name: 3. gradlew'ye Calistirma Izni Ver (chmod +x)
        # gradlew dosyasina calistirma izni verir (tv_project altinda oldugu dogrulandi)
        run: chmod +x tv_project/gradlew
          
      - name: 4. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # 5. Gradle Onbellegini Yapilandir (Cache adimini baslikta degistirdim, icerik ayni)
      - name: 5. Gradle Onbellegini Yapilandir
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 'tv_project' klasorunu dogrudan kullaniyoruz
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_project/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      # 🚀 KRITIK GÜNCELLEME: assembleDebug komutuna --stacktrace eklendi
      - name: 6. Debug (Hata Ayiklama) APK'sini Olustur
        run: |
          echo "Proje kök dizinine gidiliyor ve Gradle çalıştırılıyor..."
          cd tv_project
          # --stacktrace ile hata olmasi durumunda detayli log aliyoruz.
          ./gradlew assembleDebug --stacktrace
          
      # 7. Olusan APK'yi Yukle (Artifact)
      - name: 7. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
