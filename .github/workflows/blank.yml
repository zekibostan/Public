name: Build APK from tv.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install unzip
      run: sudo apt-get install -y unzip

    - name: Extract tv.zip
      run: |
        unzip -o tv.zip -d project
        echo "ZIP extracted."

    - name: Ensure Gradle Wrapper Exists
      run: |
        cd project

        # Create gradlew
        if [ ! -f "gradlew" ]; then
          echo "Creating gradlew..."
          cat << 'EOF' > gradlew
#!/bin/sh
DEFAULT_JVM_OPTS=""
CLASSPATH=gradle/wrapper/gradle-wrapper.jar
exec java $DEFAULT_JVM_OPTS -cp $CLASSPATH org.gradle.wrapper.GradleWrapperMain "$@"
EOF
          chmod +x gradlew
        fi

        # Create wrapper folder
        mkdir -p gradle/wrapper

        # gradle-wrapper.properties
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          echo "Creating gradle-wrapper.properties..."
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
        fi

        # gradle-wrapper.jar
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Downloading gradle-wrapper.jar..."
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradlebin.zip
          unzip -p gradlebin.zip gradle-8.4/lib/gradle-launcher-8.4.jar > gradle/wrapper/gradle-wrapper.jar
          rm gradlebin.zip
        fi

        # Root settings.gradle
        if [ ! -f "settings.gradle" ]; then
          echo "rootProject.name = 'EgzeTvPlus'" > settings.gradle
        fi

        # Root build.gradle
        if [ ! -f "build.gradle" ]; then
          cat << 'EOF' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
EOF
        fi

    - name: Ensure app/build.gradle Exists
      run: |
        cd project

        if [ ! -f "app/build.gradle" ]; then
          mkdir -p app
          cat << 'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace "com.egzetv.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.egzetv.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {}
EOF
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        cd project
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EgzeTvPlu
