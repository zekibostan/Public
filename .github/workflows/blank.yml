name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      - name: 3. ChannelsFragment.kt'yi Duzelt (sed ile import eklendi)
        run: |
          echo "ChannelsFragment.kt dosyasina lifecycleScope importu ekleniyor..."
          # ChannelsFragment.kt dosyasina yeni import satiri eklenir
          sed -i '/import androidx.leanback.widget.ListRowPresenter/a\import androidx.lifecycle.lifecycleScope' tv_project/app/src/main/java/com/egze/tvplus/ChannelsFragment.kt
          # fetchChannels fonksiyonu duzeltilir
          sed -i 's/fetchChannels()/{N;s/fetchChannels()\n    }\n\n    private fun fetchChannels() {/fetchChannels()\n    }\n\n    private fun fetchChannels() {\n        val handler = CoroutineExceptionHandler { _, ex ->\n            Log.e("ChannelsFragment", "API error: ${ex.message}")\n        }\n        lifecycleScope.launch(handler)/g' tv_project/app/src/main/java/com/egze/tvplus/ChannelsFragment.kt
          
      - name: 4. ChannelsSearchFragment.kt'yi Duzelt (sed ile KTX importlari ve onItemClicked)
        run: |
          echo "ChannelsSearchFragment.kt dosyasindaki importlar ve tiklama islemi duzeltiliyor..."
          # KTX uzantilarini import et
          sed -i 's/import androidx.leanback.app.SearchFragment/import androidx.leanback.app.SearchSupportFragment\nimport androidx.leanback.app.searchResultProvider\nimport androidx.leanback.app.setSearchAffordanceColor\nimport androidx.leanback.widget.OnItemViewClickedListener/g' tv_project/app/src/main/java/com/egze/tvplus/ChannelsSearchFragment.kt
          # searchResultProvider atamasini duzelt
          sed -i 's/super.onCreate(savedInstanceState)/super.onCreate(savedInstanceState)\n        searchResultProvider = this/g' tv_project/app/src/main/java/com/egze/tvplus/ChannelsSearchFragment.kt

      # Hata veren 44. satırın bulunduğu blok
      - name: 5. app/build.gradle Dosyasini Yeniden Olustur
        run: |
          echo "Eski app/build.gradle siliniyor ve yenisi yaziliyor..."
          rm -f tv_project/app/build.gradle
          cat > tv_project/app/build.gradle <<'EOT'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.egze.tvplus'
    compileSdk 35

    defaultConfig {
        applicationId "com.egze.tvplus"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.2.0'
    
    # Coroutine ve lifecycleScope uzantilari
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"    
    implementation "androidx.activity:activity-ktx:1.8.2"    
    
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
EOT

      - name: 5.5 ADIM: AndroidManifest.xml Duzeltme
        run: |
          echo "AndroidManifest.xml dosyasi duzeltiliyor..."
          rm -f tv_project/app/src/main/AndroidManifest.xml
          cat > tv_project/app/src/main/AndroidManifest.xml <<'EOT'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-feature android:name="android.software.leanback" android:required="true" />
    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">
        
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:icon="@mipmap/ic_launcher"
            android:label="@string/app_name"
            android:logo="@mipmap/ic_launcher"
            android:screenOrientation="landscape">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
            </intent-filter>
        </activity>
        
        <activity android:name=".PlayerActivity" />
        <activity android:name=".SearchActivity" />
    </application>
</manifest>
EOT

      - name: 5.6 ADIM: activity_player.xml Duzeltme
        run: |
          echo "activity_player.xml dosyasindaki hatali namespace duzeltiliyor..."
          sed -i 's/android:use_controller/app:use_controller/g' tv_project/app/src/main/res/layout/activity_player.xml
          sed -i 's/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android" xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/g' tv_project/app/src/main/res/layout/activity_player.xml

      - name: 6. Kok build.gradle Dosyasini Yeniden Olustur
        run: |
          cat > tv_project/build.gradle <<'EOT'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.6.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
EOT

      - name: 7. gradle.properties Ayarlari
        run: |
          touch tv_project/gradle.properties
          echo "android.useAndroidX=true" >> tv_project/gradle.properties
          echo "android.enableJetifier=true" >> tv_project/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> tv_project/gradle.properties

      - name: 8. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 9. Gerekli Android SDK (35) Kurulumu
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: 10. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          
      - name: 11. Gradle Kurulumu (8.10.2)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2' 
          
      - name: 12. Debug APK'sini Olustur
        run: |
          echo "Build baslatiliyor..."
          cd tv_project
          gradle assembleDebug --stacktrace --warning-mode all --refresh-dependencies
          
      - name: 13. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
