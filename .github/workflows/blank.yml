        cat > app/src/main/kotlin/com/example/tvapp/network/ApiService.kt << 'EOF_API'
package com.example.tvapp.network

import com.example.tvapp.model.ApiResponse
import retrofit2.Response
import retrofit2.http.GET

interface ApiService {
    @GET("app-api/channels.php") 
    suspend fun getChannels(): Response<ApiResponse>
