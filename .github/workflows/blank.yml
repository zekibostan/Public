name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      - name: 3. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🚨 KRİTİK ADIM: Compile SDK 34'ü garantili kuruyoruz.
      - name: 4. Gerekli Android SDK (34) Kurulumu
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          # Bu projenin ihtiyaci olan Kotlin Toolchain'i ayarliyoruz
          build-tools: '34.0.0'

      - name: 5. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          
      # Gradle 8.1.1 kullanmaya devam ediyoruz, cunku projenizin istegi bu.
      - name: 6. Gradle Kurulumu (8.1.1 - Proje Uyumu)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1' 
          
      - name: 7. Debug APK'sini Olustur (Direkt Gradle Komutu)
        run: |
          echo "Final build denemesi baslatiliyor..."
          cd tv_project
          # gradlew eksik oldugu icin 'gradle' komutunu kullaniyoruz.
          gradle assembleDebug --stacktrace --warning-mode all
          
      - name: 8. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
