name: Android TV APK Olusturma

# Bu workflow'u main branch'e bir 'push' yapildiginda 
# veya GitHub arayuzunden manuel olarak calistirabilirsiniz.
on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    # Build islemini Ubuntu isletim sistemi uzerinde calistir.
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek (Checkout Repository)
        uses: actions/checkout@v4
      
      # ZIP dosyasini 'tv_project' adli bir klasore cikarir.
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "public/tv.zip dosyasini tv_project klasorune cikariyor..."
          mkdir -p tv_project
          # Varsayilan olarak 'unzip' komutunun var oldugunu varsayar.
          # -d tv_project: cikarma isleminin yapilacagi dizin
          unzip public/tv.zip -d tv_project
          ls -R tv_project # Cikarilan dosyalari listele (Hata ayiklama icin faydali)
          
      # Android icin gerekli olan Java Development Kit'i (JDK) kurar.
      - name: 3. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      # Gradle onbellekleme (caching) islemi, ard arda yapilan build'leri hizlandirir.
      - name: 4. Gradle Onbellegini Yapilandir
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # 'gradle-wrapper.properties' dosyasinin hash'ini kullanarak bir anahtar olusturur.
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_project/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      # APK'yi olusturma (Build) islemini baslatir.
      - name: 5. Surum (Release) APK'sini Olustur
        run: |
          # Cikarilan proje klasorune giris yapilir.
          cd tv_project
          # Gradle Wrapper kullanarak Release (yayin) modunda APK olustur.
          # Not: Eger projeniz imzalama (signing) anahtari gerektiriyorsa, 
          # bu adimda hata alabilirsiniz ve YML dosyasina imzalama adimlari eklenmelidir.
          ./gradlew assembleRelease
          
      # Olusan APK dosyasini indirmeniz icin GitHub'a yukler.
      - name: 6. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: android-tv-apk
          # Yaygin bir Android projesi yolu: tv_project/app/build/outputs/apk/release/
          path: tv_project/app/build/outputs/apk/release/*.apk
