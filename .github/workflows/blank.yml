        # MainFragment.kt ve CardPresenter.kt
        cat > app/src/main/kotlin/com/example/tvapp/ui/main/MainFragment.kt << 'EOF_MAIN'
package com.example.tvapp.ui.main

import android.content.Intent
import android.os.Bundle
import android.view.ViewGroup
import androidx.leanback.app.BrowseSupportFragment
import androidx.leanback.widget.*
import androidx.lifecycle.lifecycleScope
import com.bumptech.glide.Glide
import com.example.tvapp.model.ChannelModel
import com.example.tvapp.network.ApiService
import com.example.tvapp.ui.playback.PlaybackActivity
import retrofit2.Retrofit
import retrofit2.converter.gson.GsonConverterFactory
import kotlinx.coroutines.launch
import androidx.leanback.widget.ImageCardView

class MainFragment : BrowseSupportFragment() {

    private val BASE_API_URL = "https://egze.org/tv/" 
    private val BASE_LOGO_URL = "https://egze.org/tv/images/thumbnail_images/"

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        title = "Canlı TV Rehberi"
        loadRows()
        onItemViewClickedListener = ItemViewClickedListener()
    }
    
    private fun loadRows() {
        val rowsAdapter = ArrayObjectAdapter(ListRowPresenter())
        val cardPresenter = CardPresenter(BASE_LOGO_URL)

        lifecycleScope.launch {
            try {
                val retrofit = Retrofit.Builder()
                    .baseUrl(BASE_API_URL)
                    .addConverterFactory(GsonConverterFactory.create())
                    .build()

                val apiService = retrofit.create(ApiService::class.java)
                val response = apiService.getChannels()
                
                if (response.isSuccessful && response.body() != null) {
                    val groupedChannels = response.body()!!.channels.groupBy { it.description }

                    groupedChannels.forEach { (categoryTitle, channelList) ->
                        val listRowAdapter = ArrayObjectAdapter(cardPresenter)
                        channelList.forEach { listRowAdapter.add(it) }

                        val header = HeaderItem(categoryTitle)
                        rowsAdapter.add(ListRow(header, listRowAdapter))
                    }
                    adapter = rowsAdapter
                }
            } catch (e: Exception) {
                println("API hatası: ${e.message}")
            }
        }
    }

    private inner class ItemViewClickedListener : OnItemViewClickedListener {
        override fun onItemClicked(
            itemViewHolder: Presenter.ViewHolder?, item: Any?,
            rowViewHolder: RowPresenter.ViewHolder?, row: Row?
        ) {
            if (item is ChannelModel) {
                val intent = Intent(activity, PlaybackActivity::class.java).apply {
                    putExtra("CHANNEL_DATA", item)
                }
                startActivity(intent)
            }
        }
    }
}

class CardPresenter(private val logoBaseUrl: String) : Presenter() {
    override fun onCreateViewHolder(parent: ViewGroup): ViewHolder {
        val cardView = ImageCardView(parent.context).apply {
            isFocusable = true
            isFocusableInTouchMode = true
            setMainImageDimensions(300, 200) 
        }
        return ViewHolder(cardView)
    }

    override fun onBindViewHolder(viewHolder: ViewHolder, item: Any) {
        val channel = item as ChannelModel
        val cardView = viewHolder.view as ImageCardView
        
        cardView.titleText = channel.title
        cardView.contentText = channel.description 
        
        val fullLogoUrl = logoBaseUrl + channel.thumbImg
        Glide.with(cardView.context)
            .load(fullLogoUrl)
            .centerInside() 
            .into(cardView.mainImageView)
    }

    override fun onUnbindViewHolder(viewHolder: ViewHolder) { 
        (viewHolder.view as ImageCardView).mainImage = null
    }
}
// EOF_MAIN
EOF_MAIN

        # PlaybackActivity.kt
        cat > app/src/main/kotlin/com/example/tvapp/ui/playback/PlaybackActivity.kt << 'EOF_PLAYBACK'
package com.example.tvapp.ui.playback

import android.app.Activity
import android.net.Uri
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import android.view.KeyEvent
import android.view.View
import android.widget.ImageView
import android.widget.TextView
import androidx.constraintlayout.widget.ConstraintLayout
import com.bumptech.glide.Glide
import com.google.android.exoplayer2.ExoPlayer
import com.google.android.exoplayer2.MediaItem
import com.google.android.exoplayer2.source.hls.HlsMediaSource
import com.google.android.exoplayer2.ui.PlayerView
import com.google.android.exoplayer2.upstream.DefaultHttpDataSource
import com.example.tvapp.R
import com.example.tvapp.model.ChannelModel

class PlaybackActivity : Activity() {
    private lateinit var player: ExoPlayer
    private lateinit var playerView: PlayerView
    private lateinit var channelData: ChannelModel
    private lateinit var infoOverlay: ConstraintLayout
    private lateinit var overlayTitle: TextView
    private lateinit var overlayCategory: TextView
    private lateinit var overlayLogo: ImageView
    
    private val hideHandler = Handler(Looper.getMainLooper())
    private val HIDE_DELAY_MS = 3000L // 3 saniye
    private val BASE_LOGO_URL = "https://egze.org/tv/images/thumbnail_images/"

    private val hideRunnable = Runnable { hideOverlay() }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_playback)
        
        playerView = findViewById(R.id.player_view)
        infoOverlay = findViewById(R.id.info_overlay)
        overlayTitle = findViewById(R.id.overlay_title)
        overlayCategory = findViewById(R.id.overlay_category)
        overlayLogo = findViewById(R.id.overlay_logo)
        
        channelData = intent.getParcelableExtra("CHANNEL_DATA") ?: run { finish(); return }
        
        initializePlayer(channelData.url)
        showOverlay(channelData) 
    }
    
    private fun initializePlayer(hlsUrl: String) {
        player = ExoPlayer.Builder(this).build()
        playerView.player = player
        
        val httpDataSourceFactory = DefaultHttpDataSource.Factory()
        val mediaSource = HlsMediaSource.Factory(httpDataSourceFactory)
            .createMediaSource(MediaItem.fromUri(Uri.parse(hlsUrl)))

        player.setMediaSource(mediaSource)
        player.prepare()
        player.play()
    }

    private fun showOverlay(data: ChannelModel) {
        overlayTitle.text = data.title
        overlayCategory.text = data.description
        
        val fullLogoUrl = BASE_LOGO_URL + data.thumbImg
        Glide.with(this).load(fullLogoUrl).into(overlayLogo)

        infoOverlay.apply {
            visibility = View.VISIBLE
            alpha = 0f
            animate().alpha(1f).setDuration(400).start() 
        }
        
        hideHandler.removeCallbacks(hideRunnable)
        hideHandler.postDelayed(hideRunnable, HIDE_DELAY_MS) 
    }

    private fun hideOverlay() {
        infoOverlay.apply {
            animate().alpha(0f).setDuration(400).withEndAction {
                visibility = View.GONE
            }.start()
        }
    }
    
    override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
        return when (keyCode) {
            KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                if (infoOverlay.visibility == View.GONE || infoOverlay.alpha == 0f) {
                    showOverlay(channelData)
                } else {
                    hideOverlay()
                }
                true
            }
            else -> super.onKeyDown(keyCode, event)
        }
    }
    
    override fun onPause() {
        super.onPause()
        player.pause()
    }

    override fun onDestroy() {
        super.onDestroy()
        player.release()
        hideHandler.removeCallbacks(hideRunnable)
    }
}
// EOF_PLAYBACK
EOF_PLAYBACK

