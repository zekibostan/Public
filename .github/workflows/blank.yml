name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi tv_project klasorune cikartiliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      # 🚀 YENİ KONTROL ADIMI: Gerekli dosyalarin varligini teyit et
      - name: 3. Kritik Dosya Kontrolu ⚠️
        run: |
          echo "--- Dosya Kontrolu Basliyor ---"
          
          # Gradle Wrapper scriptinin varligini kontrol et
          if [ -f tv_project/gradlew ]; then
            echo "✅ tv_project/gradlew dosyasi bulundu."
          else
            echo "❌ HATA: tv_project/gradlew dosyasi bulunamadi. ZIP icerigini kontrol edin."
            exit 1
          fi
          
          # app/build.gradle dosyasinin varligini kontrol et
          if [ -f tv_project/app/build.gradle ]; then
            echo "✅ tv_project/app/build.gradle dosyasi bulundu."
          else
            echo "❌ HATA: tv_project/app/build.gradle dosyasi bulunamadi. Bu dosya olmadan derleme yapilamaz."
            exit 1
          fi
          
          echo "--- Kritik Dosyalar Teyit Edildi ---"
          
      - name: 4. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. gradlew Dosyasini Tamir Et (dos2unix)
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          
          # Dosya formatini Unix'e cevir ve calistirma izni ver
          dos2unix tv_project/gradlew
          chmod +x tv_project/gradlew
          
      - name: 6. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 7. Debug APK'sini Olustur
        run: |
          echo "Build baslatiliyor..."
          cd tv_project
          ./gradlew assembleDebug --stacktrace
          
      - name: 8. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
