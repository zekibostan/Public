name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek (Checkout Repository)
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "tv.zip dosyasini tv_project klasorune cikariyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      - name: 3. gradlew'ye Calistirma Izni Ver (chmod +x)
        # gradlew dosyasina calistirma izni verir
        run: chmod +x tv_project/gradlew
          
      - name: 4. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 5. Gradle Onbellegini Yapilandir
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_project/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      # 🚀 GÜNCELLEME: assembleRelease yerine assembleDebug kullaniliyor.
      - name: 6. Debug (Hata Ayiklama) APK'sini Olustur
        run: |
          # Projenizin kök dizinine girdiğinizden emin olun (tv_project)
          cd tv_project
          ./gradlew assembleDebug
          
      # 🔍 HATA AYIKLAMA: APK'nin olmasi gereken klasoru listeler
      - name: 7. Cikis Klasorunu Listele (Hata Ayiklama)
        if: ${{ always() }} # Hata olsa bile calistir
        run: ls -R tv_project/app/build/outputs/apk/

      # 📦 GÜNCELLEME: Artifact yolu debug klasörüne ayarlandi.
      - name: 8. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          # release yerine debug klasorunu isaret ediyoruz
          path: tv_project/app/build/outputs/apk/debug/*.apk
