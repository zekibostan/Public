name: Build APK from tv.zip

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip wget zip

      - name: Extract tv.zip to project/
        run: |
          if [ ! -f tv.zip ]; then
            echo "tv.zip not found in repo root. Please upload tv.zip to the repository root."
            ls -la
            exit 1
          fi
          unzip -o tv.zip -d project
          echo "Extracted tv.zip -> project/"

      - name: Create gradlew if missing
        run: |
          cd project || exit 1
          if [ ! -f gradlew ]; then
            printf '%s\n' '#!/bin/sh' 'DEFAULT_JVM_OPTS=""' 'CLASSPATH=gradle/wrapper/gradle-wrapper.jar' 'exec java $DEFAULT_JVM_OPTS -cp $CLASSPATH org.gradle.wrapper.GradleWrapperMain "$@"' > gradlew
            chmod +x gradlew
            echo "Created gradlew"
          else
            echo "gradlew already exists"
          fi

      - name: Ensure gradle wrapper files
        run: |
          cd project || exit 1
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
            echo "Created gradle/wrapper/gradle-wrapper.properties"
          else
            echo "gradle-wrapper.properties exists"
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle distribution to extract wrapper jar..."
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle-dist.zip
            unzip -p /tmp/gradle-dist.zip gradle-8.4/lib/gradle-launcher-8.4.jar > gradle/wrapper/gradle-wrapper.jar || true
            rm -f /tmp/gradle-dist.zip
            echo "gradle-wrapper.jar created"
          else
            echo "gradle-wrapper.jar exists"
          fi

      - name: Ensure root Gradle files
        run: |
          cd project || exit 1
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            printf '%s\n' "rootProject.name = 'EgzeTvPlus'" > settings.gradle
            echo "Created settings.gradle"
          else
            echo "settings.gradle exists"
          fi

          if [ ! -f build.gradle ]; then
            printf '%s\n' "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } } allprojects { repositories { google(); mavenCentral() } } task clean(type: Delete) { delete rootProject.buildDir }" > build.gradle
            echo "Created root build.gradle"
          else
            echo "root build.gradle exists"
          fi

      - name: Ensure app/build.gradle exists (if missing create minimal)
        run: |
          cd project || exit 1
          if [ ! -d app ]; then
            echo "No app/ module found — creating placeholder app module"
            mkdir -p app/src/main
            printf '%s\n' "plugins { id 'com.android.application' } android { namespace 'com.egze.tvplus' compileSdk 34 defaultConfig { applicationId 'com.egze.tvplus' minSdk 21 targetSdk 34 versionCode 1 versionName '1.0' } } dependencies {}" > app/build.gradle
          elif [ ! -f app/build.gradle ]; then
            printf '%s\n' "plugins { id 'com.android.application' } android { namespace 'com.egze.tvplus' compileSdk 34 defaultConfig { applicationId 'com.egze.tvplus' minSdk 21 targetSdk 34 versionCode 1 versionName '1.0' } } dependencies {}" > app/build.gradle
          else
            echo "app/build.gradle exists"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable and run assembleDebug
        run: |
          cd project || exit 1
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgzeTvPlus-APK
          path: project/app/build/outputs/apk/debug/*.apk
