name: Full Android TV Build with Code Generation

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Bu, GitHub arayüzünden manuel tetiklemeye izin verir

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📦 Projeyi Kontrol Et
      uses: actions/checkout@v4

    - name: 🛠️ Java ve Android SDK Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: 📝 Kod Dosyalarını ve Proje Yapılandırmasını Oluştur
      # Bu adım, projenin tüm gerekli dizinlerini, Gradle dosyalarını ve Kotlin/XML kodlarını yazar.
      run: |
        # Dizinleri oluştur
        mkdir -p app/src/main/kotlin/com/example/tvapp/{model,network,ui/{main,playback}}
        mkdir -p app/src/main/res/{layout,values}
        
        # Temel Gradle dosyalarını oluştur (app/build.gradle ve settings.gradle.kts)
        cat > app/build.gradle << EOF
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize' 
}

android {
    namespace 'com.example.tvapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tvapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1' 
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
EOF

        cat > settings.gradle.kts << EOF
rootProject.name = "TVApp"
include(":app")
EOF

        # AndroidManifest.xml'i oluştur
        cat > app/src/main/AndroidManifest.xml << EOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <uses-feature android:name="android.software.leanback" android:required="true" />
    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:supportsRtl="true"
        android:theme="@style/Theme.Tvapp">
        
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
            </intent-filter>
        </activity>
        <activity android:name=".ui.playback.PlaybackActivity" />

    </application>
</manifest>
EOF

        # MainActivity.kt'yi oluştur
        cat > app/src/main/kotlin/com/example/tvapp/MainActivity.kt << EOF
package com.example.tvapp

import androidx.fragment.app.FragmentActivity
import android.os.Bundle
import com.example.tvapp.ui.main.MainFragment

class MainActivity : FragmentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        if (savedInstanceState == null) {
            supportFragmentManager.beginTransaction()
                .replace(android.R.id.content, MainFragment())
                .commit()
        }
    }
}
