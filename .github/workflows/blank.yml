name: Android TV APK Olusturma

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build_apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4
      
      - name: 2. tv.zip Dosyasini Cikar
        run: |
          echo "ZIP dosyasi cikariliyor..."
          mkdir -p tv_project
          unzip tv.zip -d tv_project
          
      # 🚀 KRİTİK TAMİR ADIMI: Yanlış versiyonları ve eksik depolari duzeltiyoruz
      - name: 3. Proje Dosyalarini Otomatik Tamir Et
        run: |
          echo "--- 1. Yanlis ExoPlayer surumu duzeltiliyor ---"
          # exoplayer:2.20.0 (olmayan surum) -> exoplayer:2.19.1 (var olan surum) olarak degistiriliyor
          sed -i 's/exoplayer:2.20.0/exoplayer:2.19.1/g' tv_project/app/build.gradle
          
          echo "--- 2. Root build.gradle dosyasi yeniden yaziliyor (Jitpack ekleniyor) ---"
          # Mevcut dosyayi ezip, gerekli tum depolari iceren dogru yapiyi yaziyoruz
          cat <<EOF > tv_project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.1"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  jcenter() 
              }
          }
          EOF
          
          echo "--- 3. AndroidX ve Jetifier ayarlari ekleniyor ---"
          touch tv_project/gradle.properties
          echo "android.useAndroidX=true" >> tv_project/gradle.properties
          echo "android.enableJetifier=true" >> tv_project/gradle.properties
          
          echo "--- Tum duzeltmeler tamamlandi ---"

      - name: 4. Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Gerekli Android SDK (34) Kurulumu
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: 6. Android Lisanslarini Olustur
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-googletv-license
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          
      - name: 7. Gradle Kurulumu (8.1.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1' 
          
      - name: 8. Debug APK'sini Olustur
        run: |
          echo "Build baslatiliyor..."
          cd tv_project
          # --refresh-dependencies ile yeni ekledigimiz repolari kullanarak indirmeyi zorluyoruz
          gradle assembleDebug --stacktrace --warning-mode all --refresh-dependencies
          
      - name: 9. Olusan APK'yi Yukle (Artifact)
        uses: actions/upload-artifact@v4 
        with:
          name: android-tv-apk-debug
          path: tv_project/app/build/outputs/apk/debug/*.apk
